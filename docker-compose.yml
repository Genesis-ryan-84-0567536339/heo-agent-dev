services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: heo-agent:latest
    container_name: heo-agent-copilot
    restart: unless-stopped
    ports:
      - "5051:5051"
      - "5066:5066"
    volumes:
      - ./assets:/app/assets:Z
      - ./data:/app/data:Z
      - ./workspace:/app/workspace:Z
      - ./logs:/app/logs:Z
      - ./auth:/app/auth:Z
      - ./config:/app/config:Z
      - ./bin:/app/bin:Z
      - ./cli:/app/cli:Z
      - ./engine:/app/engine:Z
      - ./scripts:/app/scripts:Z
      - ./bridge/bot.js:/app/bridge/bot.js:Z
      - ./entrypoint.sh:/app/entrypoint.sh:Z
      - ./DISCLAIMER.md:/app/DISCLAIMER.md:Z
      - ./skills:/app/skills:Z
    environment:
      - HOME=/app/auth/home
      - BASE_DIR=/app
      - WORKSPACE_DIR=/app/workspace
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
      - AUTH_DIR=/app/auth
      - CONFIG_FILE=/app/config/config.json
      - AGY_BIN=/app/bin/agy
      - GEMINI_DIR=/app/auth/home/.gemini
      - XDG_DATA_HOME=/app/auth/xdg-data
    stdin_open: true
    tty: true
    command: ["daemon"]
